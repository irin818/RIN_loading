<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RIN Body</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: rgba(2, 4, 3, 0.88);
        color: #d8ffe5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      main {
        width: min(320px, calc(100vw - 28px));
        border: 1px solid rgba(103, 232, 249, 0.35);
        padding: 18px;
        background: rgba(3, 18, 18, 0.9);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      p {
        margin: 8px 0 0;
        color: #9bc9ad;
        font-size: 12px;
        line-height: 1.5;
      }

      code {
        color: #67e8f9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RIN Body</h1>
      <p>The desktop wrapper loads <code>/body/floating</code>.</p>
      <p>Start RIN locally, then run this desktop command again.</p>
    </main>
  </body>
</html>
